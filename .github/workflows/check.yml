name: broker-check
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: npm i mqtt@5.10.1
      - run: |
          cat > t.js <<'JS'
          const mqtt = require('mqtt');
          const urls = ['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
          (async () => { for (const u of urls) { await new Promise(res => {
            const t0 = Date.now(), topic = 'vedquiz/v1/CHK' + Math.random().toString(36).slice(2);
            const a = mqtt.connect(u, { connectTimeout: 8000, reconnectPeriod: 0 });
            const to = setTimeout(() => { console.log(u, 'FAIL timeout'); a.end(true); res(); }, 12000);
            a.on('error', e => console.log(u, 'error', e.message));
            a.on('connect', () => { a.publish(topic, 'hello', { qos: 1, retain: true }, () => {
              const b = mqtt.connect(u, { reconnectPeriod: 0 });
              b.on('connect', () => b.subscribe(topic, { qos: 1 }));
              b.on('message', (tp, m) => { console.log(u, 'OK retained roundtrip', m.toString(), (Date.now() - t0) + 'ms');
                a.publish(topic, '', { retain: true }); clearTimeout(to); setTimeout(() => { a.end(true); b.end(true); res(); }, 300); });
            }); });
          }); } })();
          JS
          node t.js
